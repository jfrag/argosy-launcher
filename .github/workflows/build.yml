name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compose versions resolved
        run: |
          set -o pipefail
          ./gradlew :app:dependencyInsight --configuration debugRuntimeClasspath --dependency androidx.compose.ui:ui 2>&1 | tee insight.log
          v=$(grep -m1 -oE 'androidx.compose.ui:ui:[0-9][^ ]*' insight.log || echo "unknown")
          echo "::notice title=Compose UI resolved::$v"

      - name: Build debug APK (arm64)
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build-debug.log

      - name: Report debug build errors
        if: failure()
        run: scripts/ci-annotate-errors.sh build-debug.log

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: argosy-frame-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Build release APK (arm64, debug-signed)
        id: release
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --stop || true
          pkill -f KotlinCompileDaemon || true
          ./gradlew assembleRelease -x verifyQuayPassReleaseConfig -x verifyReleaseSigningConfig --stacktrace \
            -Pkotlin.compiler.execution.strategy=in-process \
            -Dorg.gradle.jvmargs="-Xmx12g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            2>&1 | tee build-release.log

      - name: Report release build errors
        if: steps.release.outcome == 'failure'
        run: scripts/ci-annotate-errors.sh build-release.log

      - name: Upload release APK
        if: steps.release.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: argosy-frame-release
          path: app/build/outputs/apk/release/*.apk
