name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compose versions resolved
        run: ./gradlew :app:dependencyInsight --configuration debugRuntimeClasspath --dependency androidx.compose.ui:ui | head -40

      - name: Build debug APK (arm64)
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: argosy-frame-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Build release APK (arm64, debug-signed)
        id: release
        continue-on-error: true
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK
        if: steps.release.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: argosy-frame-release
          path: app/build/outputs/apk/release/*.apk
